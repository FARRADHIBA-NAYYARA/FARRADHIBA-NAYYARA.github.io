<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elsa Elsi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body
    style="
      background-image: url(https://img.magnific.com/foto-premium/latar-belakang-tekstur-cat-air-berwarna-pastel_1228018-647.jpg?semt=ais_hybrid&w=740&q=80);
    "
    class="flex justify-center h-screen items-center"
  >
    <div
      class="bg-white border px-10 py-8 border-4 border-gray-300 shadow-lg shadow-blue-300 rounded-xl text-center animate__animated animate__backInDown m-8 w-80"
      id="kartu"
    >
      <h1 class="text-4xl">jiaaakhaha</h1>
      <h1
        class="text-3xl text-gray-500 font-bold animate__animated animate__pulse animate__infinite"
      >
      PRANKKK
      <button
        class="p-2 bg-gray-600 text-white rounded mt-5 hover:bg-gray-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada"
        onclick="ubahKartu()"
      >
        sini kak
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
    <script>
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
      });
      let kartu = document.getElementById("kartu");
      function ubahKartu() {
        kartu.innerHTML = `    <h1 class="font-semibold text-wrap animate__animated animate__zoomIn">
      hehe mungkin aku durhaka ngerjain oranngtua hehe mana lagi pindahan hehe semangat selalu kak anggap aku dosbing mu. KAK KALO SOMEDAY NGERASA SUNTUK DI KOST CARI AKU YA siap menemani berkeliling bagaikan ariela vivianty lintas jakpus jakut jaksel wlewleo
    </h1>
    <h2 class="mt-3 animate__animated animate__fadeIn">
      warm metal, farra keren
    </h2>
    <button
      class="p-2 bg-slate-600 text-white rounded mt-5 hover:bg-slate-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada"
      onclick="refresh()"
    >
      sekian
    </button>
    `;
      }
      function refresh() {
        location.reload();
      }
    </script>
  </body>
</html>
